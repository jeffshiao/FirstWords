
name: Build First Words APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip FirstWordsAndroid_GitHubBuild.zip

      - name: Build APK
        working-directory: FirstWordsAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: first-words-debug-apk
          path: FirstWordsAndroid/app/build/outputs/apk/debug/app-debug.apk
